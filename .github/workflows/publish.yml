name: Publish signed installer
on:
  push:
    branches: [main]
    paths: ['.release/current/**']
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Windows installer and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .release/current/version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="desktop-v$version"
          gh release create "$tag" .release/current/*.exe .release/current/*.sig .release/current/latest.json --target "$GITHUB_SHA" --title "HEXA $version — Windows" --notes-file .release/current/notes.md --latest
